services:
  marketbrain-service:
    build:
      context: ./marketbrain-service
    environment:
      MARKETBRAIN_DB_URL: ${MARKETBRAIN_DB_URL:-jdbc:postgresql://host.docker.internal:5432/marketbrain}
      MARKETBRAIN_DB_USERNAME: ${MARKETBRAIN_DB_USERNAME:-marketbrain_app}
      MARKETBRAIN_DB_PASSWORD: ${MARKETBRAIN_DB_PASSWORD:?set MARKETBRAIN_DB_PASSWORD locally}
      # Listen on the container network so Docker can forward the host port.
      # The published port below remains restricted to Windows localhost.
      MARKETBRAIN_SERVER_ADDRESS: 0.0.0.0
      MARKETBRAIN_OLLAMA_BASE_URL: ${MARKETBRAIN_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MARKETBRAIN_EXECUTION_MODE: PAPER
      MARKETBRAIN_PAYTM_ENABLED: ${MARKETBRAIN_PAYTM_ENABLED:-false}
      MARKETBRAIN_PAYTM_BASE_URL: ${MARKETBRAIN_PAYTM_BASE_URL:-https://developer.paytmmoney.com}
      MARKETBRAIN_PAYTM_ACCESS_TOKEN: ${MARKETBRAIN_PAYTM_ACCESS_TOKEN:-}
      MARKETBRAIN_UPSTOX_ENABLED: ${MARKETBRAIN_UPSTOX_ENABLED:-false}
      MARKETBRAIN_UPSTOX_BASE_URL: ${MARKETBRAIN_UPSTOX_BASE_URL:-https://api.upstox.com}
      MARKETBRAIN_UPSTOX_NSE_INSTRUMENT_URL: ${MARKETBRAIN_UPSTOX_NSE_INSTRUMENT_URL:-https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz}
      MARKETBRAIN_UPSTOX_ANALYTICS_TOKEN: ${MARKETBRAIN_UPSTOX_ANALYTICS_TOKEN:-}
      MARKETBRAIN_BACKFILL_WORKER_ENABLED: ${MARKETBRAIN_BACKFILL_WORKER_ENABLED:-false}
      MARKETBRAIN_CURRENT_NIFTY500_URL: ${MARKETBRAIN_CURRENT_NIFTY500_URL:-https://www.niftyindices.com/IndexConstituent/ind_nifty500list.csv}
      MARKETBRAIN_BACKFILL_WORKER_DELAY_MILLIS: ${MARKETBRAIN_BACKFILL_WORKER_DELAY_MILLIS:-1500}
      MARKETBRAIN_BACKFILL_MAXIMUM_ATTEMPTS: ${MARKETBRAIN_BACKFILL_MAXIMUM_ATTEMPTS:-3}
      MARKETBRAIN_BACKFILL_MAXIMUM_EXPANSION_BATCH_SIZE: ${MARKETBRAIN_BACKFILL_MAXIMUM_EXPANSION_BATCH_SIZE:-50}
      MARKETBRAIN_BACKFILL_PILOT_SYMBOLS: ${MARKETBRAIN_BACKFILL_PILOT_SYMBOLS:-INFY,TCS,RELIANCE,HDFCBANK,ICICIBANK,SBIN,ITC,HINDUNILVR,LT,BHARTIARTL}
      MARKETBRAIN_DAILY_ENRICHMENT_SCHEDULER_ENABLED: ${MARKETBRAIN_DAILY_ENRICHMENT_SCHEDULER_ENABLED:-false}
      MARKETBRAIN_DAILY_ENRICHMENT_CRON: "${MARKETBRAIN_DAILY_ENRICHMENT_CRON:-0 0/15 16-17 * * MON-FRI}"
      MARKETBRAIN_DAILY_ENRICHMENT_FINAL_ATTEMPT_CRON: "${MARKETBRAIN_DAILY_ENRICHMENT_FINAL_ATTEMPT_CRON:-0 0 18 * * MON-FRI}"
      MARKETBRAIN_DAILY_ENRICHMENT_ZONE: ${MARKETBRAIN_DAILY_ENRICHMENT_ZONE:-Asia/Kolkata}
      MARKETBRAIN_DAILY_ENRICHMENT_MAXIMUM_CATCHUP_DAYS: ${MARKETBRAIN_DAILY_ENRICHMENT_MAXIMUM_CATCHUP_DAYS:-366}
      MARKETBRAIN_DAILY_ENRICHMENT_PROVIDER_WINDOW_START: ${MARKETBRAIN_DAILY_ENRICHMENT_PROVIDER_WINDOW_START:-16:00}
      MARKETBRAIN_DAILY_ENRICHMENT_PROVIDER_WINDOW_CUTOFF: ${MARKETBRAIN_DAILY_ENRICHMENT_PROVIDER_WINDOW_CUTOFF:-18:00}
      MARKETBRAIN_DAILY_ENRICHMENT_READINESS_SYMBOLS: ${MARKETBRAIN_DAILY_ENRICHMENT_READINESS_SYMBOLS:-HDFCBANK,INFY,RELIANCE,SBIN,TCS}
      MARKETBRAIN_DAILY_ENRICHMENT_COMPLETION_MONITOR_DELAY_MILLIS: ${MARKETBRAIN_DAILY_ENRICHMENT_COMPLETION_MONITOR_DELAY_MILLIS:-30000}
      MARKETBRAIN_TELEGRAM_ENABLED: ${MARKETBRAIN_TELEGRAM_ENABLED:-false}
      MARKETBRAIN_TELEGRAM_BOT_TOKEN: ${MARKETBRAIN_TELEGRAM_BOT_TOKEN:-}
      MARKETBRAIN_TELEGRAM_PAIRING_CODE: ${MARKETBRAIN_TELEGRAM_PAIRING_CODE:-}
      MARKETBRAIN_TELEGRAM_LONG_POLL_TIMEOUT_SECONDS: ${MARKETBRAIN_TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:-20}
      MARKETBRAIN_TELEGRAM_POLL_DELAY_MILLIS: ${MARKETBRAIN_TELEGRAM_POLL_DELAY_MILLIS:-1000}
      MARKETBRAIN_TELEGRAM_TEST_ALERTS_ENABLED: ${MARKETBRAIN_TELEGRAM_TEST_ALERTS_ENABLED:-false}
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  marketbrain-ui:
    build:
      context: ./marketbrain-ui
    depends_on:
      - marketbrain-service
    ports:
      - "127.0.0.1:8081:80"
