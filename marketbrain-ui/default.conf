server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Exact read-only route only. Never proxy training, approvals or provider controls.
    location = /api/v1/paper/account/overview {
        limit_except GET { deny all; }
        proxy_pass http://marketbrain-service:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
