spring:
  application:
    name: marketbrain-service
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: marketbrain-scheduler-
  datasource:
    url: ${MARKETBRAIN_DB_URL:jdbc:postgresql://host.docker.internal:5432/marketbrain}
    username: ${MARKETBRAIN_DB_USERNAME:marketbrain_app}
    password: ${MARKETBRAIN_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: ${MARKETBRAIN_SERVER_ADDRESS:127.0.0.1}
  port: ${MARKETBRAIN_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

marketbrain:
  execution-mode: ${MARKETBRAIN_EXECUTION_MODE:PAPER}
  paper:
    starting-cash: ${MARKETBRAIN_PAPER_STARTING_CASH:100000}
  ollama:
    base-url: ${MARKETBRAIN_OLLAMA_BASE_URL:http://host.docker.internal:11434}
  signal:
    maximum-data-age-seconds: ${MARKETBRAIN_MAXIMUM_DATA_AGE_SECONDS:90}
    target-alert-submission-seconds: ${MARKETBRAIN_TARGET_ALERT_SUBMISSION_SECONDS:60}
  paytm-money:
    base-url: ${MARKETBRAIN_PAYTM_BASE_URL:https://developer.paytmmoney.com}
    enabled: ${MARKETBRAIN_PAYTM_ENABLED:false}
    access-token: ${MARKETBRAIN_PAYTM_ACCESS_TOKEN:}
  upstox:
    base-url: ${MARKETBRAIN_UPSTOX_BASE_URL:https://api.upstox.com}
    nse-instrument-url: ${MARKETBRAIN_UPSTOX_NSE_INSTRUMENT_URL:https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz}
    enabled: ${MARKETBRAIN_UPSTOX_ENABLED:false}
    analytics-token: ${MARKETBRAIN_UPSTOX_ANALYTICS_TOKEN:}
  backfill:
    worker-enabled: ${MARKETBRAIN_BACKFILL_WORKER_ENABLED:false}
    current-nifty500-url: ${MARKETBRAIN_CURRENT_NIFTY500_URL:https://www.niftyindices.com/IndexConstituent/ind_nifty500list.csv}
    worker-delay-millis: ${MARKETBRAIN_BACKFILL_WORKER_DELAY_MILLIS:1500}
    maximum-attempts: ${MARKETBRAIN_BACKFILL_MAXIMUM_ATTEMPTS:3}
    maximum-expansion-batch-size: ${MARKETBRAIN_BACKFILL_MAXIMUM_EXPANSION_BATCH_SIZE:50}
    pilot-symbols: ${MARKETBRAIN_BACKFILL_PILOT_SYMBOLS:INFY,TCS,RELIANCE,HDFCBANK,ICICIBANK,SBIN,ITC,HINDUNILVR,LT,BHARTIARTL}
  telegram:
    enabled: ${MARKETBRAIN_TELEGRAM_ENABLED:false}
    bot-token: ${MARKETBRAIN_TELEGRAM_BOT_TOKEN:}
    pairing-code: ${MARKETBRAIN_TELEGRAM_PAIRING_CODE:}
    long-poll-timeout-seconds: ${MARKETBRAIN_TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:20}
    poll-delay-millis: ${MARKETBRAIN_TELEGRAM_POLL_DELAY_MILLIS:1000}
    test-alerts-enabled: ${MARKETBRAIN_TELEGRAM_TEST_ALERTS_ENABLED:false}
